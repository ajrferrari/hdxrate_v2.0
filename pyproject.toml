[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdxrate"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "jax>=0.4.25",
    "numpyro>=0.14",
    "molmass>=2024.1",
    "biopython>=1.83",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
